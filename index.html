<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NikRises — Discipline Engine</title>
<style>
:root{--bg:#0a0a0f;--s:#111118;--c:#16161e;--b:#232330;--g:#39ff14;--gd:rgba(57,255,20,0.1);--gg:rgba(57,255,20,0.35);--w:#efefef;--m:#777;--r:#ff3c3c;--y:#ffd600;--blue:#00d9ff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--w);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:18px 14px 100px;max-width:480px;margin:0 auto;}
.green{color:var(--g);}.red{color:var(--r);}.yellow{color:var(--y);}.blue{color:var(--blue);}
.muted{color:var(--m);font-family:monospace;font-size:10px;letter-spacing:1px;}
.surface{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px;}
.seclbl{font-family:monospace;font-size:9px;letter-spacing:2px;color:var(--m);text-transform:uppercase;margin:14px 0 8px 2px;}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 13px;background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--m);font-family:monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--gd);border-color:rgba(57,255,20,0.3);color:var(--g);}
.panel{display:none;}.panel.active{display:block;}
.bar-bg{height:6px;background:var(--b);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width 0.5s;}
.hrow{display:flex;align-items:center;gap:12px;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer;user-select:none;}
.hrow.done{background:rgba(57,255,20,0.04);border-color:rgba(57,255,20,0.25);}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--b);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;}
.hrow.done .chk{background:var(--g);border-color:var(--g);color:#000;box-shadow:0 0 8px var(--gg);}
.htxt{flex:1;font-size:13px;font-weight:600;}
.hrow.done .htxt{color:rgba(240,240,240,0.3);text-decoration:line-through;text-decoration-color:var(--g);}
.badge{font-family:monospace;font-size:9px;color:var(--g);background:var(--gd);border:1px solid rgba(57,255,20,0.2);border-radius:6px;padding:2px 6px;flex-shrink:0;}
.rank-hero{background:var(--s);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;}
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--c);border-radius:18px;padding:20px 28px;text-align:center;z-index:200;display:none;min-width:180px;}
.popup.show{display:block;}
.levelup{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;}
.levelup.show{display:flex;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.show{display:flex;}
.obox{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:22px 18px;width:100%;max-width:350px;text-align:center;max-height:90vh;overflow-y:auto;}
.btn{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;width:100%;font-family:system-ui,sans-serif;border:none;margin-top:8px;}
.btn-g{background:rgba(57,255,20,0.12);border:1px solid rgba(57,255,20,0.3)!important;color:var(--g);}
.btn-r{background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.3)!important;color:var(--r);}
.btn-y{background:rgba(255,214,0,0.1);border:1px solid rgba(255,214,0,0.3)!important;color:var(--y);}
.btn-blue{background:rgba(0,217,255,0.12);border:1px solid rgba(0,217,255,0.3)!important;color:var(--blue);}
.btn-save{background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4)!important;color:var(--g);font-size:14px;}
.btn-boss{background:rgba(255,60,60,0.16);border:1px solid rgba(255,60,60,0.4)!important;color:var(--r);font-family:monospace;font-size:11px;letter-spacing:
